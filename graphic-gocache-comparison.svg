  <text x="60" y="84" fill="#5b6573" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Same benchmark suite | Apple M3 Max | arm64 | 3 seconds | lower ns/op is better</text>


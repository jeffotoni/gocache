<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">gocache benchmark comparison</title>
  <desc id="desc">Comparison of gocache New, NewFast, go-cache, freecache, ristretto and bigcache across Set, Set/Get, Get hit and Get miss operations.</desc>
